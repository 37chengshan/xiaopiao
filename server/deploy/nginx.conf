# Ubuntu nginx HTTP-context include. Install as /etc/nginx/conf.d/xiaopiao.conf.
# cloudflare-realip.conf is generated from https://api.cloudflare.com/client/v4/ips.
include /etc/xiaopiao/cloudflare-realip.conf;

server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    server_name xiaopiao.citygenius.top;
    ssl_certificate /etc/xiaopiao/tls/origin.pem;
    ssl_certificate_key /etc/xiaopiao/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # The geo variable checks the original TCP peer, before real_ip rewrites it.
    if ($xiaopiao_cloudflare_peer = 0) { return 403; }
    client_max_body_size 512k;
    # Never log request bodies, query strings, cookies or credentials.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Xiaopiao-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
