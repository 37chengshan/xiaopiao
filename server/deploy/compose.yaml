services:
  api:
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file: /etc/xiaopiao/server.env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - api-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    expose: [8787]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the approved app domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../web/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  api-data:
  caddy-data:
  caddy-config:
