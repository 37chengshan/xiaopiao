# 安卓 APK 云端构建（tt 2026-11-03）
#   push main（动到 app/ 或 gradle）→ 构建 APK，挂在这次 Actions 运行的 Artifacts 里
#   push tag v*                     → 构建并发 GitHub Release（落地页「安卓 App」链到 releases/latest）
#   手动 Run workflow               → 同 push main；勾选 release 并填 tag 时也发 Release
#
# 签名：沿用本机 debug keystore（与 tt 手机上装的日常版同一把），存在仓库 secret DEBUG_KEYSTORE_B64：
#   base64 -i ~/.android/debug.keystore | gh secret set DEBUG_KEYSTORE_B64
# 没有这把 key 时 CI 会用临时 key，装到手机上会和已装版本签名冲突，所以发 Release 时缺 key 直接失败。
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: '发 GitHub Release'
        type: boolean
        default: false
      tag:
        description: 'Release tag（如 v2026.11.03）'
        type: string
        default: ''

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  API_BASE_URL: https://xiaopiao.citygenius.top

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decide release
        id: rel
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            [ -n "${{ inputs.tag }}" ] || { echo "::error::勾选 release 时要填 tag"; exit 1; }
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          elif [ -n "${{ steps.rel.outputs.tag }}" ]; then
            echo "::error::缺 DEBUG_KEYSTORE_B64，发出去的 APK 无法覆盖安装手机上的版本"; exit 1
          else
            echo "::warning::缺 DEBUG_KEYSTORE_B64，本次 APK 用临时签名，不能覆盖安装"
          fi

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease -Pxiaopiao.apiBaseUrl=$API_BASE_URL

      - name: Name APK
        id: apk
        run: |
          ver="${{ steps.rel.outputs.tag }}"
          name="xiaopiao-${ver:-${GITHUB_SHA::7}}-prod.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Publish release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "${{ github.sha }}" \
            --title "今日小票 $TAG" \
            --notes "服务端：$API_BASE_URL
          安装：下载 ${{ steps.apk.outputs.name }} 后在 Android 手机上安装（debug 签名，需允许未知来源）。
          提交：${{ github.sha }}"
